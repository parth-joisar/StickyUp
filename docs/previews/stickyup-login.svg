<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">StickyUp login desktop preview</title><desc id="desc">Desktop preview of the StickyUp sign-in page.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" opacity=".07"/></pattern><pattern id="paper" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#46321e" opacity=".11"/></pattern><filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity=".45"/></filter></defs>
<rect width="1440" height="1000" fill="#151515"/><rect width="1440" height="1000" fill="url(#dots)"/><rect x="505" y="135" width="430" height="730" rx="22" fill="#e3d0bf" stroke="#b59f89" filter="url(#shadow)"/><rect x="505" y="135" width="430" height="730" rx="22" fill="url(#paper)"/><rect x="850" y="190" width="90" height="90" rx="10" fill="#d8c0a5" opacity=".45" transform="rotate(12 850 190)"/>
<rect x="676" y="185" width="25" height="25" rx="6" fill="#afc0a5" transform="rotate(-13 676 185)"/><rect x="686" y="180" width="25" height="25" rx="6" fill="#afc4d2" transform="rotate(7 686 180)"/><rect x="696" y="190" width="25" height="25" rx="6" fill="#e3d0bf" stroke="#c9b39c" transform="rotate(-3 696 190)"/><text x="744" y="211" fill="#584837" font-family="Georgia,serif" font-size="28">StickyUp</text>
<text x="720" y="295" text-anchor="middle" fill="#332b25" font-family="Georgia,serif" font-size="42">Welcome back.</text><text x="720" y="332" text-anchor="middle" fill="#75685c" font-family="Arial,sans-serif" font-size="14">Your ideas are waiting for you.</text>
<text x="555" y="395" fill="#51453b" font-family="Arial,sans-serif" font-size="13" font-weight="700">Email</text><rect x="555" y="408" width="330" height="48" rx="12" fill="#fff" fill-opacity=".3" stroke="#b6a08b"/><text x="572" y="438" fill="#958577" font-family="Arial,sans-serif" font-size="14">you@example.com</text>
<text x="555" y="493" fill="#51453b" font-family="Arial,sans-serif" font-size="13" font-weight="700">Password</text><rect x="555" y="506" width="330" height="48" rx="12" fill="#fff" fill-opacity=".3" stroke="#b6a08b"/><text x="572" y="536" fill="#958577" font-family="Arial,sans-serif" font-size="14">Enter your password</text>
<rect x="556" y="581" width="14" height="14" rx="3" fill="none" stroke="#75685c"/><text x="578" y="593" fill="#75685c" font-family="Arial,sans-serif" font-size="12">Remember me</text><text x="885" y="593" text-anchor="end" fill="#584837" font-family="Arial,sans-serif" font-size="12">Forgot password?</text>
<rect x="555" y="625" width="330" height="50" rx="12" fill="#584837"/><text x="720" y="656" text-anchor="middle" fill="#f1e3d2" font-family="Arial,sans-serif" font-size="14" font-weight="700">Sign in →</text>
<path d="M555 720h128M757 720h128" stroke="#bda995"/><text x="720" y="724" text-anchor="middle" fill="#907f70" font-family="Arial,sans-serif" font-size="11">OR</text><text x="720" y="773" text-anchor="middle" fill="#75685c" font-family="Arial,sans-serif" font-size="13">Don't have an account? <tspan fill="#584837" font-weight="700">Create one</tspan></text>
</svg>