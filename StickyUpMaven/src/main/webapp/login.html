    <!DOCTYPE html>
    <html lang="en">
    <head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — StickyUp</title>

    <style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        min-height: 100vh;

        background: #151515;

        color: #eee;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        display: flex;

        align-items: center;

        justify-content: center;

        overflow: hidden;
    }


    /* ================================
       BACKGROUND
    ================================ */

    body::before {
        content: "";

        position: fixed;

        inset: 0;

        pointer-events: none;

        background-image:
            radial-gradient(
                rgba(255,255,255,.065) 1px,
                transparent 1px
            );

        background-size: 24px 24px;

        opacity: .8;
    }


    /* ================================
       LOGIN PAGE
    ================================ */

    .login-page {
        width: 100%;

        min-height: 100vh;

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 25px;
    }


    /* ================================
       LOGIN CARD
    ================================ */

    .login-card {
        width: 100%;

        max-width: 430px;

        padding: 42px;

        position: relative;

        background: #E3D0BF;

        color: #332b25;

        border:
            1px solid #b59f89;

        border-radius: 22px;

        box-shadow:
            0 35px 90px rgba(0,0,0,.45);

        overflow: hidden;

        animation:
            cardIntro .7s
            cubic-bezier(.2,.8,.2,1);
    }


    /* PAPER TEXTURE */

    .login-card::before {
        content: "";

        position: absolute;

        inset: 0;

        pointer-events: none;

        background-image:
            radial-gradient(
                rgba(70,50,30,.055) .7px,
                transparent .7px
            );

        background-size: 5px 5px;

        opacity: .8;
    }


    @keyframes cardIntro {

        0% {
            opacity: 0;

            transform:
                translateY(25px)
                scale(.96);
        }

        100% {
            opacity: 1;

            transform:
                translateY(0)
                scale(1);
        }
    }


    /* ================================
       LOGO
    ================================ */

    .logo {
        position: relative;

        z-index: 2;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 11px;

        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size: 27px;

        color: #332b25;

        margin-bottom: 35px;

        cursor: pointer;

        user-select: none;
    }



    .logo {
        text-decoration: none;
    }

    /* ================================
       MINI NOTE STACK
    ================================ */

    .logo-notes {
        width: 34px;

        height: 34px;

        position: relative;

        flex-shrink: 0;
    }


    .mini-note {
        position: absolute;

        width: 23px;

        height: 23px;

        border-radius: 6px;

        border:
            1px solid rgba(60,45,35,.16);

        box-shadow:
            0 3px 6px rgba(0,0,0,.18);
    }


    /* BACK NOTE */

    .mini-note.back {

        left: 1px;

        top: 5px;

        background: #AFC0A5;

        z-index: 1;

        animation:
            loginBack
            3s
            ease-in-out
            infinite;
    }


    /* MIDDLE NOTE */

    .mini-note.middle {

        left: 5px;

        top: 3px;

        background: #AFC4D2;

        z-index: 2;

        animation:
            loginMiddle
            3s
            ease-in-out
            .2s
            infinite;
    }


    /* FRONT NOTE */

    .mini-note.front {

        left: 9px;

        top: 8px;

        background: #E3D0BF;

        z-index: 3;

        animation:
            loginFront
            3s
            ease-in-out
            .4s
            infinite;
    }


    /* FRONT PAPER FOLD */

    .mini-note.front::after {

        content: "";

        position: absolute;

        right: 0;

        bottom: 0;

        width: 7px;

        height: 7px;

        background: #c9b39c;

        clip-path:
            polygon(
                0 100%,
                100% 0,
                100% 100%
            );

        opacity: .65;
    }


    /* ================================
       NOTE ANIMATIONS
    ================================ */

    @keyframes loginBack {

        0%,
        100% {
            transform:
                rotate(-13deg)
                translate(0,-4px);
        }

        50% {
            transform:
                rotate(-19deg)
                translate(-3px,-7px);
        }
    }


    @keyframes loginMiddle {

        0%,
        100% {
            transform:
                rotate(7deg)
                translate(0,-2px);
        }

        50% {
            transform:
                rotate(13deg)
                translate(3px,-5px);
        }
    }


    @keyframes loginFront {

        0%,
        100% {
            transform:
                rotate(-3deg)
                translate(0,0);
        }

        50% {
            transform:
                rotate(4deg)
                translate(4px,2px);
        }
    }


    /* ================================
       STICKYUP TEXT
    ================================ */

    .logo-word {

        display: inline-block;

        color: #584837;

        animation:
            loginLogoFloat
            2.4s
            ease-in-out
            infinite;
    }


    @keyframes loginLogoFloat {

        0%,
        100% {
            transform:
                translateY(0)
                rotate(0deg);
        }

        25% {
            transform:
                translateY(-4px)
                rotate(-1deg);
        }

        50% {
            transform:
                translateY(1px)
                rotate(1deg);
        }

        75% {
            transform:
                translateY(-3px)
                rotate(-.5deg);
        }
    }


    /* ================================
       LOGO HOVER
    ================================ */

    .logo:hover .back {

        transform:
            rotate(-21deg)
            translate(-4px,-7px);
    }


    .logo:hover .middle {

        transform:
            rotate(14deg)
            translate(3px,-5px);
    }


    .logo:hover .front {

        transform:
            rotate(-6deg)
            translate(5px,2px);
    }


    /* ================================
       LOGIN CONTENT
    ================================ */

    .login-content {

        position: relative;

        z-index: 2;

        text-align: center;
    }


    .login-content h1 {

        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size: 42px;

        font-weight: 400;

        line-height: 1.05;

        color: #332b25;
    }


    .login-content > p {

        margin-top: 12px;

        color: #75685c;

        font-size: 14px;

        line-height: 1.6;
    }


    /* ================================
       FORM
    ================================ */

    .login-form {

        margin-top: 32px;

        text-align: left;
    }


    .field {

        margin-bottom: 18px;
    }


    .field label {

        display: block;

        margin-bottom: 8px;

        color: #51453b;

        font-size: 13px;

        font-weight: 600;
    }


    .field input {

        width: 100%;

        height: 48px;

        padding: 0 15px;

        border:
            1px solid #b6a08b;

        border-radius: 12px;

        outline: none;

        background:
            rgba(255,255,255,.3);

        color: #332b25;

        font-size: 14px;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        transition:
            border .2s ease,
            box-shadow .2s ease,
            background .2s ease,
            transform .2s ease;
    }


    .field input::placeholder {

        color: #958577;
    }


    .field input:hover {

        background:
            rgba(255,255,255,.42);
    }


    .field input:focus {

        background:
            rgba(255,255,255,.5);

        border-color: #584837;

        box-shadow:
            0 0 0 4px
            rgba(88,72,55,.1);

        transform:
            translateY(-1px);
    }


    /* ================================
       FORM OPTIONS
    ================================ */

    .form-options {

        display: flex;

        align-items: center;

        justify-content: space-between;

        margin:
            4px 0 24px;

        font-size: 12px;
    }


    .remember {

        display: flex;

        align-items: center;

        gap: 7px;

        color: #75685c;

        cursor: pointer;
    }


    .remember input {

        accent-color: #584837;

        cursor: pointer;
    }


    .forgot {

        color: #584837;

        text-decoration: none;

        transition:
            color .2s ease;
    }


    .forgot:hover {

        color: #332b25;

        text-decoration: underline;
    }


    /* ================================
       LOGIN BUTTON
    ================================ */

    .login-button {

        width: 100%;

        height: 50px;

        border: none;

        border-radius: 12px;

        background: #584837;

        color: #bebebd;

        font-size: 14px;

        font-weight: 600;

        cursor: pointer;

        transition:
            transform .25s ease,
            background .25s ease,
            box-shadow .25s ease;
    }


    .login-button:hover {

        background: #605548;

        transform:
            translateY(-3px);

        box-shadow:
            0 10px 25px
            rgba(50,40,30,.2);
    }


    .login-button:active {

        transform:
            translateY(0)
            scale(.97);
    }


    /* ================================
       DIVIDER
    ================================ */

    .divider {

        display: flex;

        align-items: center;

        gap: 12px;

        margin:
            28px 0;

        color: #907f70;

        font-size: 11px;
    }


    .divider::before,
    .divider::after {

        content: "";

        height: 1px;

        flex: 1;

        background: #bda995;
    }


    /* ================================
       SIGN UP
    ================================ */

    .signup {

        position: relative;

        z-index: 2;

        text-align: center;

        color: #75685c;

        font-size: 13px;
    }


    .signup a {

        color: #584837;

        font-weight: 600;

        text-decoration: none;

        margin-left: 4px;

        transition:
            color .2s ease;
    }


    .signup a:hover {

        color: #332b25;

        text-decoration: underline;
    }


    /* ================================
       DECORATIVE NOTE
    ================================ */

    .decor-note {

        position: absolute;

        width: 90px;

        height: 90px;

        right: -35px;

        top: 55px;

        background: #d8c0a5;

        border-radius: 10px;

        transform: rotate(12deg);

        opacity: .5;

        box-shadow:
            0 8px 15px
            rgba(50,40,30,.12);
    }


    /* ================================
       MOBILE
    ================================ */

    @media(max-width:500px) {

        body {
            overflow-y: auto;
        }

        .login-page {

            min-height: 100vh;

            padding: 18px;
        }

        .login-card {

            padding:
                32px 25px;

            border-radius: 18px;
        }

        .login-content h1 {

            font-size: 36px;
        }

        .logo {

            font-size: 24px;

            margin-bottom: 30px;
        }

    }

    </style>
    
<style>
.password-error {
    margin: 7px 0 0;
    min-height: 16px;
    font-size: 12px;
    line-height: 1.35;
    color: #9b4f3f;
}
.password-invalid {
    border-color: #9b4f3f !important;
    outline: 2px solid rgba(155,79,63,.12);
}
.status-message { margin-top: 12px; color: #456348; font-size: 13px; line-height: 1.5; }
</style>

</head>


    <body>


    <div class="login-page">


        <div class="login-card">


            <div class="decor-note"></div>


            <!-- LOGO -->

            <a class="logo" href="index.html">

                <div class="logo-notes">

                    <span class="mini-note back"></span>

                    <span class="mini-note middle"></span>

                    <span class="mini-note front"></span>

                </div>


                <span class="logo-word">
                    StickyUp
                </span>

            </a>


            <!-- LOGIN CONTENT -->

            <div class="login-content">


                <h1>
                    Welcome back.
                </h1>


                <p>
                    Your ideas are waiting for you.
                </p>
                <p class="status-message" id="loginStatus" role="status" aria-live="polite"></p>


                <form
    class="login-form"
    action="login"
    method="post"
>


                    <div class="field">

                        <label for="email">
                            Email
                        </label>


                       <input
    type="email"
    id="email"
    name="email"
    placeholder="you@example.com"
    required
>

                    </div>


                    <div class="field">

                        <label for="password">
                            Password
                        </label>


                       <input
    type="password"
    id="password"
    name="password"
    placeholder="Enter your password"
    required
>
<p id="passwordError" class="password-error" aria-live="polite"></p>

                    </div>


                    <div class="form-options">


                        <label class="remember">

                            <input
                                type="checkbox"
                                id="rememberMe"
                            >

                            Remember me

                        </label>


                        <a href="forgot-password.html"
                            class="forgot"
                        >
                            Forgot password?
                        </a>


                    </div>


                    <button
                        type="submit"
                        class="login-button"
                    >
                       Sign in &rarr;
                    </button>


                </form>


                <div class="divider">
                    OR
                </div>


                <div class="signup">

                    Don't have an account?

                    <a href="signup.html">
                        Create one
                    </a>

                </div>


            </div>


        </div>


    </div>


    
<script>
document.addEventListener("DOMContentLoaded", function () {
    if (new URLSearchParams(window.location.search).get("reset") === "success") {
        document.getElementById("loginStatus").textContent =
            "Your password has been changed. You can sign in now.";
    }

    

    const emailInput =
        document.getElementById("email");

    const rememberMe =
        document.getElementById("rememberMe");

    if (!emailInput || !rememberMe) {
        return;
    }

    const savedEmail =
        localStorage.getItem("stickyupRememberEmail");

    if (savedEmail) {
        emailInput.value = savedEmail;
        rememberMe.checked = true;
    }

    rememberMe.addEventListener("change", function () {

        if (rememberMe.checked) {

            if (emailInput.value.trim()) {
                localStorage.setItem(
                    "stickyupRememberEmail",
                    emailInput.value.trim()
                );
            }

        } else {
            localStorage.removeItem(
                "stickyupRememberEmail"
            );
        }
    });

    emailInput.addEventListener("input", function () {

        if (rememberMe.checked) {

            localStorage.setItem(
                "stickyupRememberEmail",
                emailInput.value.trim()
            );
        }
    });

});
</script>


<script>
document.addEventListener("DOMContentLoaded", function () {
    
    const form = document.querySelector("form");
    const password = document.getElementById("password");
    const error = document.getElementById("passwordError");

    if (!form || !password || !error) return;

    function validatePassword() {
        const value = password.value;
        const errors = [];

        if (value.length < 8) {
            errors.push("At least 8 characters");
        }
        if (!/[A-Z]/.test(value)) {
            errors.push("one uppercase letter");
        }
        if (!/[a-z]/.test(value)) {
            errors.push("one lowercase letter");
        }
        if (!/[0-9]/.test(value)) {
            errors.push("one number");
        }
        if (!/[^A-Za-z0-9]/.test(value)) {
            errors.push("one special character");
        }

        if (errors.length) {
            error.textContent = "Password needs: " + errors.join(", ") + ".";
            password.classList.add("password-invalid");
            return false;
        }

        error.textContent = "";
        password.classList.remove("password-invalid");
        return true;
    }

    password.addEventListener("input", validatePassword);

    form.addEventListener("submit", function (event) {
        if (!validatePassword()) {
            event.preventDefault();
            password.focus();
        }
    });
});
</script>

</body>
    </html>
