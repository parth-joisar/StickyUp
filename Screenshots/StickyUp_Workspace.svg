<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">StickyUp workspace desktop preview</title>
<desc id="desc">A StickyUp workspace with a dark navigation sidebar, a warm paper canvas, and colorful notes, styled with Fraunces.</desc>
<defs><pattern id="paper" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#46321e" opacity=".11"/></pattern><filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#46321e" flood-opacity=".2"/></filter></defs>
<rect width="1440" height="900" fill="#151515"/>
<rect width="238" height="900" fill="#191817"/><path d="M238 0v900" stroke="#292725"/>
<g font-family="Fraunces,Georgia,serif"><text x="28" y="55" fill="#f1e3d2" font-size="25">▧ StickyUp</text><text x="28" y="112" fill="#625b55" font-size="11" letter-spacing="1.5">WORKSPACE</text><rect x="15" y="130" width="208" height="43" rx="10" fill="#29241f"/><text x="33" y="157" fill="#e3d0bf" font-size="14">▦  All Notes</text><text x="33" y="205" fill="#8d8781" font-size="14">📌  Pinned</text><text x="33" y="250" fill="#8d8781" font-size="14">♡  Favorites</text><text x="33" y="295" fill="#8d8781" font-size="14">▢  Archive</text><rect x="18" y="330" width="202" height="46" rx="11" fill="#584837"/><text x="119" y="359" text-anchor="middle" fill="#eee" font-size="14">+ New Note</text><text x="33" y="830" fill="#8d8781" font-size="14">⚙  Settings</text><text x="33" y="870" fill="#8d8781" font-size="14">↪  Log out</text></g>
<rect x="239" y="0" width="1201" height="70" fill="#181716"/><path d="M239 70h1201" stroke="#292725"/><g font-family="Fraunces,Georgia,serif"><text x="270" y="43" fill="#e8ddd2" font-size="21">My Ideas</text><text x="365" y="42" fill="#665e57" font-size="12">Personal workspace</text></g>
<rect x="1034" y="16" width="190" height="38" rx="10" fill="#201e1c" stroke="#302d2a"/><text x="1050" y="40" fill="#68625d" font-family="Fraunces,Georgia,serif" font-size="12">Search notes...</text><rect x="1240" y="16" width="38" height="38" rx="10" fill="#201e1c" stroke="#302d2a"/><text x="1259" y="42" text-anchor="middle" fill="#d5c9bd" font-family="Fraunces,Georgia,serif" font-size="18">🎨</text><circle cx="1311" cy="35" r="19" fill="#3c332b" stroke="#5c5044"/><text x="1311" y="41" text-anchor="middle" fill="#d8c6b3" font-family="Fraunces,Georgia,serif" font-size="16">P</text>
<rect x="239" y="71" width="1201" height="829" fill="#e3d0bf"/><rect x="239" y="71" width="1201" height="829" fill="url(#paper)"/><g font-family="Fraunces,Georgia,serif"><text x="270" y="125" fill="#66574a" font-size="23">My Ideas</text><text x="270" y="150" fill="#8a7969" font-size="11">A little space to think clearly.</text></g>
<g filter="url(#shadow)" font-family="Fraunces,Georgia,serif" fill="#332b25"><rect x="330" y="220" width="245" height="215" rx="11" fill="#f4d98b" transform="rotate(-3 330 220)"/><text x="354" y="270" font-size="23">Project Idea</text><text x="354" y="310" font-size="15">Build something simple,</text><text x="354" y="338" font-size="15">useful and beautiful.</text><rect x="680" y="185" width="250" height="240" rx="11" fill="#c8a9d8" transform="rotate(2 680 185)"/><text x="706" y="236" font-size="23">Things to do</text><text x="706" y="280" font-size="15">☐  Design UI</text><text x="706" y="312" font-size="15">☐  Create database</text><text x="706" y="344" font-size="15">☐  Build login</text><text x="706" y="376" font-size="15">☐  Connect backend</text><rect x="1030" y="250" width="230" height="205" rx="11" fill="#e5a6b8" transform="rotate(3 1030 250)"/><text x="1057" y="302" font-size="23">Ideas</text><text x="1057" y="344" font-size="15">Dark mode, smooth</text><text x="1057" y="372" font-size="15">interactions and visual</text><text x="1057" y="400" font-size="15">organization.</text><rect x="480" y="520" width="245" height="190" rx="11" fill="#a8c9df" transform="rotate(2 480 520)"/><text x="507" y="571" font-size="22">Remember</text><text x="507" y="612" font-size="15">Keep important ideas</text><text x="507" y="640" font-size="15">where you can see them.</text><rect x="835" y="510" width="245" height="190" rx="11" fill="#b3d39a" transform="rotate(-2 835 510)"/><text x="862" y="562" font-size="22">Next steps</text><text x="862" y="603" font-size="15">Sketch the flow and</text><text x="862" y="631" font-size="15">share it with the team.</text></g>
</svg>
