<!-- hero --><text x="720" y="182" text-anchor="middle" fill="#c7a77e" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">A PLACE FOR YOUR THOUGHTS</text><text x="720" y="300" text-anchor="middle" fill="#eee" font-family="Georgia,serif" font-size="76">Think on paper.</text><text x="720" y="388" text-anchor="middle" fill="#f1deac" font-family="Georgia,serif" font-size="76">Even digitally.</text><text x="720" y="456" text-anchor="middle" fill="#999" font-family="Arial,sans-serif" font-size="18">StickyUp turns scattered thoughts into a visual workspace where</text><text x="720" y="485" text-anchor="middle" fill="#999" font-family="Arial,sans-serif" font-size="18">ideas can be captured, arranged and turned into something useful.</text><rect x="625" y="522" width="190" height="54" rx="12" fill="#514238"/><text x="720" y="556" text-anchor="middle" fill="#fff0df" font-family="Arial,sans-serif" font-size="16" font-weight="700">Start creating →</text>
