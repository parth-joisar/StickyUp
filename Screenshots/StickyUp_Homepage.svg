<!-- visual thinking --><text x="130" y="2750" fill="#c7a77e" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">THINK VISUALLY</text><text x="130" y="2830" fill="#eee" font-family="Georgia,serif" font-size="48">Your thoughts don't have</text><text x="130" y="2890" fill="#eee" font-family="Georgia,serif" font-size="48">to live in a list.</text><text x="130" y="2960" fill="#999" font-family="Arial,sans-serif" font-size="18">Place ideas beside each other. See relationships.</text><text x="130" y="2990" fill="#999" font-family="Arial,sans-serif" font-size="18">Move things around until the answer starts</text><text x="130" y="3020" fill="#999" font-family="Arial,sans-serif" font-size="18">making sense.</text><rect x="925" y="2700" width="180" height="150" rx="12" fill="#f4d98b" transform="rotate(-5 925 2700)" filter="url(#shadow)"/><text x="952" y="2750" fill="#332b25" font-family="Georgia,serif" font-size="20">Project idea</text><text x="952" y="2790" fill="#51453b" font-family="Arial,sans-serif" font-size="14">Start with one</text><text x="952" y="2814" fill="#51453b" font-family="Arial,sans-serif" font-size="14">small step.</text><rect x="1100" y="2790" width="180" height="150" rx="12" fill="#b3d39a" transform="rotate(4 1100 2790)" filter="url(#shadow)"/><text x="1127" y="2840" fill="#332b25" font-family="Georgia,serif" font-size="20">Remember</text><text x="1127" y="2880" fill="#51453b" font-family="Arial,sans-serif" font-size="14">Keep what</text><text x="1127" y="2904" fill="#51453b" font-family="Arial,sans-serif" font-size="14">matters nearby.</text><rect x="980" y="2960" width="180" height="145" rx="12" fill="#a8c9df" transform="rotate(-2 980 2960)" filter="url(#shadow)"/><text x="1007" y="3010" fill="#332b25" font-family="Georgia,serif" font-size="20">Next step</text><text x="1007" y="3050" fill="#51453b" font-family="Arial,sans-serif" font-size="14">Turn the idea</text><text x="1007" y="3074" fill="#51453b" font-family="Arial,sans-serif" font-size="14">into a plan.</text>
