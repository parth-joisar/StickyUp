<!-- how it works --><text x="720" y="1450" text-anchor="middle" fill="#c7a77e" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">HOW IT WORKS</text><text x="720" y="1525" text-anchor="middle" fill="#eee" font-family="Georgia,serif" font-size="54">From thought to clarity.</text><text x="720" y="1570" text-anchor="middle" fill="#999" font-family="Arial,sans-serif" font-size="18">Three simple steps. No complicated organization required.</text>
<rect x="120" y="1640" width="380" height="270" rx="18" fill="#ead8a7" stroke="#c9b77f"/><text x="156" y="1705" fill="#927b3d" font-family="Georgia,serif" font-size="48">01</text><text x="156" y="1770" fill="#40362d" font-family="Georgia,serif" font-size="30">Capture it</text><text x="156" y="1820" fill="#62584f" font-family="Arial,sans-serif" font-size="16">Write the thought before it disappears.</text><text x="156" y="1848" fill="#62584f" font-family="Arial,sans-serif" font-size="16">Ideas don't need perfect structure.</text>
<rect x="530" y="1640" width="380" height="270" rx="18" fill="#c9d5c0" stroke="#aebda2"/><text x="566" y="1705" fill="#687b5e" font-family="Georgia,serif" font-size="48">02</text><text x="566" y="1770" fill="#384034" font-family="Georgia,serif" font-size="30">Arrange it</text><text x="566" y="1820" fill="#62584f" font-family="Arial,sans-serif" font-size="16">Move notes around, give them colors,</text><text x="566" y="1848" fill="#62584f" font-family="Arial,sans-serif" font-size="16">and create your own visual structure.</text>
<rect x="940" y="1640" width="380" height="270" rx="18" fill="#d8c0c0" stroke="#bea3a3"/><text x="976" y="1705" fill="#886665" font-family="Georgia,serif" font-size="48">03</text><text x="976" y="1770" fill="#403434" font-family="Georgia,serif" font-size="30">Make it useful</text><text x="976" y="1820" fill="#62584f" font-family="Arial,sans-serif" font-size="16">Turn scattered thoughts into plans,</text><text x="976" y="1848" fill="#62584f" font-family="Arial,sans-serif" font-size="16">tasks and decisions.</text>
