<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="4200" viewBox="0 0 1440 4200" role="img" aria-labelledby="title desc">
<title id="title">StickyUp homepage desktop preview</title><desc id="desc">Full page desktop preview of the StickyUp landing page with a sticky-note demo, product explanation, workspace preview, and call to action.</desc>
