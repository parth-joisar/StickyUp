<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">StickyUp password reset request desktop preview</title>
<desc id="desc">The StickyUp forgot password form where a user enters an email to request a reset for administrator review, styled with Fraunces.</desc>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" opacity=".07"/></pattern><pattern id="paper" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#46321e" opacity=".11"/></pattern><filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity=".45"/></filter></defs>
<rect width="1440" height="900" fill="#151515"/><rect width="1440" height="900" fill="url(#dots)"/><rect x="500" y="120" width="440" height="660" rx="22" fill="#e3d0bf" stroke="#b59f89" filter="url(#shadow)"/><rect x="500" y="120" width="440" height="660" rx="22" fill="url(#paper)"/><g font-family="Fraunces,Georgia,serif"><text x="720" y="205" text-anchor="middle" fill="#584837" font-size="27" font-weight="700">StickyUp</text><text x="720" y="295" text-anchor="middle" fill="#332b25" font-size="38">Forgot your password?</text><text x="720" y="340" text-anchor="middle" fill="#75685c" font-size="15">Enter the email address on your account to</text><text x="720" y="365" text-anchor="middle" fill="#75685c" font-size="15">request a password reset.</text><text x="555" y="430" fill="#51453b" font-size="14" font-weight="600">Email</text></g><rect x="555" y="447" width="330" height="50" rx="12" fill="#f0e2d4" stroke="#b6a08b"/><text x="573" y="478" fill="#958577" font-family="Fraunces,Georgia,serif" font-size="15">you@example.com</text><rect x="555" y="527" width="330" height="52" rx="12" fill="#584837"/><text x="720" y="560" text-anchor="middle" fill="#fff" font-family="Fraunces,Georgia,serif" font-size="15" font-weight="700">Send reset link</text><text x="720" y="630" text-anchor="middle" fill="#6b5847" font-family="Fraunces,Georgia,serif" font-size="13">If an account uses that email, an administrator</text><text x="720" y="652" text-anchor="middle" fill="#6b5847" font-family="Fraunces,Georgia,serif" font-size="13">can review the request.</text><text x="720" y="713" text-anchor="middle" fill="#584837" font-family="Fraunces,Georgia,serif" font-size="14" font-weight="600">Back to sign in</text>
</svg>
