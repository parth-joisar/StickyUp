<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
<title id="title">StickyUp sign-up desktop preview</title><desc id="desc">Desktop preview of the StickyUp account creation page.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" opacity=".07"/></pattern><pattern id="paper" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#46321e" opacity=".11"/></pattern><filter id="shadow" x="-25%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity=".45"/></filter></defs>
<rect width="1440" height="1100" fill="#151515"/><rect width="1440" height="1100" fill="url(#dots)"/><rect x="485" y="85" width="470" height="930" rx="22" fill="#e3d0bf" stroke="#b59f89" filter="url(#shadow)"/><rect x="485" y="85" width="470" height="930" rx="22" fill="url(#paper)"/><rect x="870" y="145" width="90" height="90" rx="10" fill="#d8c0a5" opacity=".45" transform="rotate(12 870 145)"/>
<rect x="648" y="130" width="25" height="25" rx="6" fill="#afc0a5" transform="rotate(-13 648 130)"/><rect x="658" y="125" width="25" height="25" rx="6" fill="#afc4d2" transform="rotate(7 658 125)"/><rect x="668" y="135" width="25" height="25" rx="6" fill="#e3d0bf" stroke="#c9b39c" transform="rotate(-3 668 135)"/><text x="716" y="156" fill="#584837" font-family="Georgia,serif" font-size="28">StickyUp</text>
<text x="720" y="225" text-anchor="middle" fill="#332b25" font-family="Georgia,serif" font-size="40">Start creating.</text><text x="720" y="262" text-anchor="middle" fill="#75685c" font-family="Arial,sans-serif" font-size="14">Create your space for ideas.</text>
<text x="535" y="318" fill="#51453b" font-family="Arial,sans-serif" font-size="13" font-weight="700">Name</text><rect x="535" y="331" width="370" height="47" rx="12" fill="#fff" fill-opacity=".3" stroke="#b6a08b"/><text x="552" y="361" fill="#958577" font-family="Arial,sans-serif" font-size="14">Your name</text>
<text x="535" y="414" fill="#51453b" font-family="Arial,sans-serif" font-size="13" font-weight="700">Email</text><rect x="535" y="427" width="370" height="47" rx="12" fill="#fff" fill-opacity=".3" stroke="#b6a08b"/><text x="552" y="457" fill="#958577" font-family="Arial,sans-serif" font-size="14">you@example.com</text>
<text x="535" y="510" fill="#51453b" font-family="Arial,sans-serif" font-size="13" font-weight="700">Password</text><rect x="535" y="523" width="370" height="47" rx="12" fill="#fff" fill-opacity=".3" stroke="#b6a08b"/><text x="552" y="553" fill="#958577" font-family="Arial,sans-serif" font-size="14">Create a password</text><text x="880" y="553" text-anchor="end" fill="#75685c" font-family="Arial,sans-serif" font-size="12">Show</text>
<text x="535" y="606" fill="#51453b" font-family="Arial,sans-serif" font-size="13" font-weight="700">Confirm password</text><rect x="535" y="619" width="370" height="47" rx="12" fill="#fff" fill-opacity=".3" stroke="#b6a08b"/><text x="552" y="649" fill="#958577" font-family="Arial,sans-serif" font-size="14">Repeat your password</text><text x="880" y="649" text-anchor="end" fill="#75685c" font-family="Arial,sans-serif" font-size="12">Show</text>
<rect x="536" y="693" width="14" height="14" rx="3" fill="none" stroke="#75685c"/><text x="560" y="704" fill="#75685c" font-family="Arial,sans-serif" font-size="12">I agree to the <tspan fill="#584837">Terms</tspan> and <tspan fill="#584837">Privacy Policy</tspan>.</text>
<rect x="535" y="737" width="370" height="50" rx="12" fill="#584837"/><text x="720" y="768" text-anchor="middle" fill="#f1e3d2" font-family="Arial,sans-serif" font-size="14" font-weight="700">Create account →</text>
<path d="M535 825h148M757 825h148" stroke="#bda995"/><text x="720" y="829" text-anchor="middle" fill="#907f70" font-family="Arial,sans-serif" font-size="11">OR</text><text x="720" y="876" text-anchor="middle" fill="#75685c" font-family="Arial,sans-serif" font-size="13">Already have an account? <tspan fill="#584837" font-weight="700">Sign in</tspan></text>
</svg>