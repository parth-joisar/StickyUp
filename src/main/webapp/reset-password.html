<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a new password — StickyUp</title>
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #151515; color: #332b25; font: 16px Arial, sans-serif; }
        .card { width: min(100%, 440px); padding: 42px; border: 1px solid #b59f89; border-radius: 22px; background: #E3D0BF; box-shadow: 0 35px 90px #0007; }
        .brand { display: block; margin-bottom: 32px; color: #584837; font: bold 26px Georgia, serif; text-align: center; text-decoration: none; }
        h1 { margin: 0; font: normal 38px Georgia, serif; text-align: center; }
        .intro { margin: 12px 0 28px; color: #75685c; line-height: 1.6; text-align: center; }
        .field { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; color: #51453b; font-size: 13px; font-weight: 600; }
        input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid #b6a08b; border-radius: 12px; background: #f0e2d4; color: #332b25; font-size: 15px; }
        input:focus { outline: 2px solid #907f70; }
        button { width: 100%; min-height: 50px; margin-top: 8px; border: 0; border-radius: 12px; background: #584837; color: #fff; font-weight: 700; cursor: pointer; }
        button:hover { background: #6a5846; }
        button:disabled { cursor: not-allowed; opacity: .55; }
        .notice { min-height: 20px; margin: 10px 0 0; color: #8d4638; font-size: 13px; line-height: 1.5; }
        .back { display: block; margin-top: 24px; color: #584837; font-size: 14px; font-weight: 600; text-align: center; text-decoration: none; }
        @media(max-width: 500px) { .card { padding: 32px 24px; } h1 { font-size: 33px; } }
    </style>
</head>
<body>
    <main class="card">
        <a class="brand" href="index.html">StickyUp</a>
        <h1>Choose a new password</h1>
        <p class="intro">Use at least 8 characters, including uppercase, lowercase, a number, and a symbol.</p>
        <form action="reset-password" method="post" id="resetForm">
            <input type="hidden" name="token" id="token">
            <div class="field">
                <label for="password">New password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required>
            </div>
            <div class="field">
                <label for="confirmPassword">Confirm new password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
            </div>
            <p class="notice" id="notice" role="status" aria-live="polite"></p>
            <button type="submit" id="submitButton">Save new password</button>
        </form>
        <a class="back" href="login.html">Back to sign in</a>
    </main>
    <script>
        const params = new URLSearchParams(location.search);
        const token = params.get("token") || "";
        const notice = document.getElementById("notice");
        const submitButton = document.getElementById("submitButton");
        document.getElementById("token").value = token;
        if (!token) {
            notice.textContent = "This reset link is missing or has already expired. Request a new one.";
            submitButton.disabled = true;
        } else if (params.get("status") === "expired") {
            notice.textContent = "This reset link has expired or was already used. Request a new one.";
        } else if (params.get("status") === "invalid") {
            notice.textContent = "Choose a strong password and make sure both passwords match.";
        } else if (params.get("status") === "error") {
            notice.textContent = "We couldn’t save your password. Please try again.";
        }
        document.getElementById("resetForm").addEventListener("submit", event => {
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const strong = password.length >= 8 && /[A-Z]/.test(password) && /[a-z]/.test(password) && /[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password);
            if (!strong || password !== confirmPassword) {
                event.preventDefault();
                notice.textContent = !strong ? "Password must meet all the requirements above." : "The passwords do not match.";
            }
        });
    </script>
</body>
</html>
