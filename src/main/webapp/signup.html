<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Join — StickyUp</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #151515;
    color: #eee;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow-y: auto;
}

body::before {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background-image:
        radial-gradient(
            rgba(255,255,255,.065) 1px,
            transparent 1px
        );

    background-size: 24px 24px;
}


/* ================================
   PAGE
================================ */

.signup-page {
    width: 100%;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px 20px;
}


/* ================================
   CARD
================================ */

.signup-card {
    width: 100%;
    max-width: 470px;

    padding: 42px;

    position: relative;

    background: #E3D0BF;
    color: #332b25;

    border: 1px solid #b59f89;
    border-radius: 22px;

    box-shadow:
        0 35px 90px rgba(0,0,0,.45);

    overflow: hidden;

    animation:
        cardIntro .7s
        cubic-bezier(.2,.8,.2,1);
}

.signup-card::before {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    background-image:
        radial-gradient(
            rgba(70,50,30,.055) .7px,
            transparent .7px
        );

    background-size: 5px 5px;

    opacity: .8;
}

@keyframes cardIntro {

    0% {
        opacity: 0;

        transform:
            translateY(25px)
            scale(.96);
    }

    100% {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* ================================
   LOGO
================================ */

.logo {
    position: relative;
    z-index: 2;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 11px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 27px;

    color: #332b25;

    margin-bottom: 30px;

    cursor: pointer;

    user-select: none;
}

.logo-notes {
    width: 34px;
    height: 34px;

    position: relative;
    flex-shrink: 0;
}

.mini-note {
    position: absolute;

    width: 23px;
    height: 23px;

    border-radius: 6px;

    border:
        1px solid rgba(60,45,35,.16);

    box-shadow:
        0 3px 6px rgba(0,0,0,.18);
}


/* BACK */

.mini-note.back {
    left: 1px;
    top: 5px;

    background: #AFC0A5;

    z-index: 1;

    animation:
        logoBack 3s ease-in-out infinite;
}


/* MIDDLE */

.mini-note.middle {
    left: 5px;
    top: 3px;

    background: #AFC4D2;

    z-index: 2;

    animation:
        logoMiddle 3s ease-in-out .2s infinite;
}


/* FRONT */

.mini-note.front {
    left: 9px;
    top: 8px;

    background: #E3D0BF;

    z-index: 3;

    animation:
        logoFront 3s ease-in-out .4s infinite;
}

.mini-note.front::after {
    content: "";

    position: absolute;

    right: 0;
    bottom: 0;

    width: 7px;
    height: 7px;

    background: #c9b39c;

    clip-path:
        polygon(
            0 100%,
            100% 0,
            100% 100%
        );

    opacity: .65;
}


/* NOTE ANIMATION */

@keyframes logoBack {

    0%, 100% {
        transform:
            rotate(-13deg)
            translate(0,-4px);
    }

    50% {
        transform:
            rotate(-19deg)
            translate(-3px,-7px);
    }
}

@keyframes logoMiddle {

    0%, 100% {
        transform:
            rotate(7deg)
            translate(0,-2px);
    }

    50% {
        transform:
            rotate(13deg)
            translate(3px,-5px);
    }
}

@keyframes logoFront {

    0%, 100% {
        transform:
            rotate(-3deg)
            translate(0,0);
    }

    50% {
        transform:
            rotate(4deg)
            translate(4px,2px);
    }
}


/* LOGO TEXT */

.logo-word {
    display: inline-block;

    color: #584837;

    animation:
        logoFloat 2.4s ease-in-out infinite;
}

@keyframes logoFloat {

    0%, 100% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    25% {
        transform:
            translateY(-4px)
            rotate(-1deg);
    }

    50% {
        transform:
            translateY(1px)
            rotate(1deg);
    }

    75% {
        transform:
            translateY(-3px)
            rotate(-.5deg);
    }
}


/* LOGO HOVER */

.logo:hover .back {
    transform:
        rotate(-21deg)
        translate(-4px,-7px);
}

.logo:hover .middle {
    transform:
        rotate(14deg)
        translate(3px,-5px);
}

.logo:hover .front {
    transform:
        rotate(-6deg)
        translate(5px,2px);
}


/* ================================
   CONTENT
================================ */

.signup-content {
    position: relative;
    z-index: 2;

    text-align: center;
}

.signup-content h1 {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 40px;

    font-weight: 400;

    line-height: 1.05;

    color: #332b25;
}

.signup-content > p {
    margin-top: 12px;

    color: #75685c;

    font-size: 14px;

    line-height: 1.6;
}


/* ================================
   FORM
================================ */

.signup-form {
    margin-top: 28px;

    text-align: left;
}

.field {
    margin-bottom: 16px;
}

.field label {
    display: block;

    margin-bottom: 7px;

    color: #51453b;

    font-size: 13px;

    font-weight: 600;
}

.field input {
    width: 100%;

    height: 47px;

    padding: 0 15px;

    border:
        1px solid #b6a08b;

    border-radius: 12px;

    outline: none;

    background:
        rgba(255,255,255,.3);

    color: #332b25;

    font-size: 14px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    transition:
        border .2s ease,
        box-shadow .2s ease,
        background .2s ease,
        transform .2s ease;
}

.field input::placeholder {
    color: #958577;
}

.field input:hover {
    background:
        rgba(255,255,255,.42);
}

.field input:focus {
    background:
        rgba(255,255,255,.5);

    border-color: #584837;

    box-shadow:
        0 0 0 4px
        rgba(88,72,55,.1);

    transform:
        translateY(-1px);
}


/* ================================
   PASSWORD
================================ */

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 48px;
}

.show-password {
    position: absolute;

    right: 13px;
    top: 50%;

    transform: translateY(-50%);

    border: none;

    background: transparent;

    color: #75685c;

    cursor: pointer;

    font-size: 12px;

    padding: 4px;

    transition:
        color .2s ease;
}

.show-password:hover {
    color: #332b25;
}


/* ================================
   TERMS
================================ */

.terms {
    display: flex;

    align-items: flex-start;

    gap: 8px;

    margin:
        6px 0 22px;

    color: #75685c;

    font-size: 11px;

    line-height: 1.5;
}

.terms input {
    margin-top: 2px;

    accent-color: #584837;

    cursor: pointer;
}

.terms a {
    color: #584837;

    text-decoration: none;
}

.terms a:hover {
    text-decoration: underline;
}


/* ================================
   BUTTON
================================ */

.signup-button {
    width: 100%;

    height: 50px;

    border: none;

    border-radius: 12px;

    background: #584837;

    color: #bebebd;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;

    transition:
        transform .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}

.signup-button:hover {
    background: #605548;

    transform:
        translateY(-3px);

    box-shadow:
        0 10px 25px
        rgba(50,40,30,.2);
}

.signup-button:active {
    transform:
        translateY(0)
        scale(.97);
}


/* ================================
   DIVIDER
================================ */

.divider {
    display: flex;

    align-items: center;

    gap: 12px;

    margin:
        25px 0;

    color: #907f70;

    font-size: 11px;
}

.divider::before,
.divider::after {
    content: "";

    height: 1px;

    flex: 1;

    background: #bda995;
}


/* ================================
   LOGIN LINK
================================ */

.login-link {
    position: relative;

    z-index: 2;

    text-align: center;

    color: #75685c;

    font-size: 13px;
}

.login-link a {
    color: #584837;

    font-weight: 600;

    text-decoration: none;

    margin-left: 4px;

    transition:
        color .2s ease;
}

.login-link a:hover {
    color: #332b25;

    text-decoration: underline;
}


/* ================================
   DECORATIVE NOTE
================================ */

.decor-note {
    position: absolute;

    width: 90px;
    height: 90px;

    right: -35px;
    top: 50px;

    background: #d8c0a5;

    border-radius: 10px;

    transform: rotate(12deg);

    opacity: .5;

    box-shadow:
        0 8px 15px
        rgba(50,40,30,.12);
}


/* ================================
   MOBILE
================================ */

@media(max-width:500px) {

    .signup-page {
        padding: 18px;
    }

    .signup-card {
        padding:
            32px 25px;

        border-radius: 18px;
    }

    .signup-content h1 {
        font-size: 35px;
    }

    .logo {
        font-size: 24px;

        margin-bottom: 27px;
    }
}

</style>


<style>
.password-error {
    margin: 7px 0 0;
    min-height: 17px;
    font-size: 12px;
    line-height: 1.35;
    color: #9b4f3f;
}

.password-invalid {
    border-color: #9b4f3f !important;
    box-shadow: 0 0 0 2px rgba(155,79,63,.10);
}

.password-valid {
    border-color: #78956f !important;
}
</style>

</head>


<body>


<div class="signup-page">


    <div class="signup-card">


        <div class="decor-note"></div>


        <!-- LOGO -->

        <div
            class="logo"
            onclick="window.location.href='index.html'"
        >

            <div class="logo-notes">

                <span class="mini-note back"></span>

                <span class="mini-note middle"></span>

                <span class="mini-note front"></span>

            </div>


            <span class="logo-word">
                StickyUp
            </span>

        </div>


        <!-- CONTENT -->

        <div class="signup-content">


            <h1>
                Start creating.
            </h1>


            <p>
                Create your space for ideas.
            </p>


            <!-- FORM -->

            <form
                class="signup-form"
                action="signup"
                method="POST"
                onsubmit="return createAccount()"
            >


                <div class="field">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        required
                    >

                </div>


                <div class="field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="field">

                    <label for="password">
                        Password
                    </label>


                    <div class="password-box">

                        <input
                            type="password"
                            id="password" name="password"
                            placeholder="Create a password"
                            minlength="6"
                            required
                        >
                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('password', this)"
                        >
                            Show
                        </button>

                    </div>
                    <p id="passwordError" class="password-error" aria-live="polite"></p>

                </div>


                <div class="field">

                    <label for="confirmPassword">
                        Confirm password
                    </label>


                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Repeat your password"
                            minlength="6"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('confirmPassword', this)"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>

                        I agree to the
                        <a href="#">
                            Terms
                        </a>
                        and
                        <a href="#">
                            Privacy Policy
                        </a>.

                    </span>

                </label>


                <button
                    type="submit"
                    class="signup-button"
                >
                    Create account →
                </button>


            </form>


            <div class="divider">
                OR
            </div>


            <div class="login-link">

                Already have an account?

                <a href="login.html">
                    Sign in
                </a>

            </div>


        </div>


    </div>


</div>


<script>


/* ================================
   PASSWORD TOGGLE
================================ */

function togglePassword(
    inputId,
    button
) {

    const input =
        document.getElementById(inputId);


    if (
        input.type === "password"
    ) {

        input.type = "text";

        button.textContent =
            "Hide";

    } else {

        input.type = "password";

        button.textContent =
            "Show";
    }
}


/* ================================
   TEMPORARY SIGNUP
================================ */

function createAccount() {

    const password =
        document.getElementById(
            "password"
        ).value;

    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        ).value;


    if (
        password !== confirmPassword
    ) {

        alert(
            "Passwords do not match."
        );

        return false;
    }


    // Validation passed. Allow the browser to POST the form to /signup.
    return true;
}

</script>



<script>
document.addEventListener("DOMContentLoaded", function () {

    const form =
        document.querySelector(".signup-form");

    const password =
        document.getElementById("password");

    const error =
        document.getElementById("passwordError");

    if (!form || !password || !error) {
        return;
    }

    function validateSignupPassword() {

        const value = password.value;
        const errors = [];

        if (value.length < 8) {
            errors.push("8 characters");
        }

        if (!/[A-Z]/.test(value)) {
            errors.push("one uppercase letter");
        }

        if (!/[a-z]/.test(value)) {
            errors.push("one lowercase letter");
        }

        if (!/[0-9]/.test(value)) {
            errors.push("one number");
        }

        if (!/[^A-Za-z0-9]/.test(value)) {
            errors.push("one special character");
        }

        if (errors.length) {
            error.textContent =
                "Password needs: " +
                errors.join(", ") + ".";

            password.classList.add("password-invalid");
            password.classList.remove("password-valid");

            return false;
        }

        error.textContent =
            "Strong password ✓";

        password.classList.remove("password-invalid");
        password.classList.add("password-valid");

        return true;
    }

    password.addEventListener(
        "input",
        validateSignupPassword
    );

    form.addEventListener(
        "submit",
        function (event) {

            if (!validateSignupPassword()) {
                event.preventDefault();
                password.focus();
            }
        }
    );

});
</script>

</body>
</html>
