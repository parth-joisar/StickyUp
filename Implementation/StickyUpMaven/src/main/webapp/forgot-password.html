<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password — StickyUp</title>

<style>
@font-face {
    font-family: "Fraunces";
    src: url("assets/fonts/Fraunces-Variable.ttf") format("truetype");
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
}

@font-face {
    font-family: "Fraunces";
    src: url("assets/fonts/Fraunces-Italic-Variable.ttf") format("truetype");
    font-style: italic;
    font-weight: 100 900;
    font-display: swap;
}

        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #151515; color: #332b25; font: 16px "Fraunces", Georgia, serif; }
        .card { width: min(100%, 440px); padding: 42px; border: 1px solid #b59f89; border-radius: 22px; background: #E3D0BF; box-shadow: 0 35px 90px #0007; }
        .brand { display: block; margin-bottom: 32px; color: #584837; font: bold 26px "Fraunces", Georgia, serif; text-align: center; text-decoration: none; }
        h1 { margin: 0; font: normal 38px "Fraunces", Georgia, serif; text-align: center; }
        .intro { margin: 12px 0 28px; color: #75685c; line-height: 1.6; text-align: center; }
        label { display: block; margin-bottom: 8px; color: #51453b; font-size: 13px; font-weight: 600; }
        input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid #b6a08b; border-radius: 12px; background: #f0e2d4; color: #332b25; font-size: 15px; }
        input:focus { outline: 2px solid #907f70; }
        button { width: 100%; min-height: 50px; margin-top: 22px; border: 0; border-radius: 12px; background: #584837; color: #fff; font-weight: 700; cursor: pointer; }
        button:hover { background: #6a5846; }
        .notice { min-height: 20px; margin: 12px 0 0; color: #6b5847; font-size: 13px; line-height: 1.5; }
        .back { display: block; margin-top: 24px; color: #584837; font-size: 14px; font-weight: 600; text-align: center; text-decoration: none; }
        @media(max-width: 500px) { .card { padding: 32px 24px; } h1 { font-size: 33px; } }
    </style>
</head>
<body>
    <main class="card">
        <a class="brand" href="index.html">StickyUp</a>
        <h1>Forgot your password?</h1>
        <p class="intro">Enter the email address on your account to request a password reset.</p>
        <form action="forgot-password" method="post">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
            <p class="notice" id="notice" role="status" aria-live="polite"></p>
            <button type="submit">Send reset link</button>
        </form>
        <a class="back" href="login.html">Back to sign in</a>
    </main>
    <script>
        const status = new URLSearchParams(location.search).get("status");
        const notice = document.getElementById("notice");
        if (status === "sent") {
            notice.textContent = "If an account uses that email, an administrator can review the request.";
        } else if (status === "pending") {
            notice.textContent = "Your reset request was saved for manual review. If an account uses that email, the administrator can review it.";
        } else if (status === "unavailable") {
            notice.textContent = "We couldn’t save the request right now. Please try again later.";
        }
    </script>
</body>
</html>
